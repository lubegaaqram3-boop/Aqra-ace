<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aqra Ace — Meet. Connect. Belong.</title>
<style>
:root{--ink:#172033;--muted:#667085;--bg:#f6f8fc;--card:#fff;--line:#e6eaf0;--brand:#5b5ce2;--brand2:#8b5cf6;--safe:#16875a;--danger:#c0394b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}button{cursor:pointer;border:0}.top{position:sticky;top:0;z-index:10;background:#ffffffee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;justify-content:space-between}.logo{display:flex;gap:10px;align-items:center;font-weight:850;font-size:20px}.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-weight:900}.nav{display:flex;gap:5px}.nav button,.mobile button{background:transparent;color:var(--muted);padding:10px;border-radius:12px}.nav .active,.mobile .active{background:#eeeefe;color:var(--brand);font-weight:750}main{max-width:1100px;margin:auto;padding:30px 18px 90px}.hero{padding:35px 0;display:grid;grid-template-columns:1.2fr .8fr;gap:25px;align-items:center}.hero h1{font-size:clamp(44px,8vw,76px);line-height:.98;margin:0 0 16px;letter-spacing:-3px}.hero h1 span{color:var(--brand)}.hero p{font-size:18px;color:var(--muted);line-height:1.6}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 14px 40px #17203312}.grid{display:grid;gap:15px}.two{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:repeat(3,1fr)}.primary,.secondary,.danger{padding:12px 16px;border-radius:13px;font-weight:750}.primary{background:var(--brand);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.danger{background:#fff0f2;color:var(--danger)}.muted{color:var(--muted)}.pill{display:inline-block;padding:6px 9px;border-radius:99px;background:#f0f1ff;color:#4e4fc4;font-size:12px;font-weight:700;margin:3px}.profile{display:flex;gap:13px;align-items:center}.avatar{width:52px;height:52px;border-radius:17px;background:linear-gradient(135deg,#e9e8ff,#dff8ee);display:grid;place-items:center;font-weight:850;color:#4647a9}.profile h3{margin:0 0 3px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.search,.form input,.form select{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;outline:0;background:#fff}.form{display:grid;gap:12px}.form label{font-size:13px;font-weight:750}.modal{position:fixed;inset:0;background:#17203366;display:grid;place-items:center;padding:18px;z-index:50}.modal .card{max-width:520px;width:100%;max-height:92vh;overflow:auto}.hidden{display:none!important}.chat{min-height:280px;max-height:50vh;overflow:auto;background:#fafbfe;border:1px solid var(--line);border-radius:15px;padding:13px}.message{padding:10px 13px;border-radius:15px;background:#eeeefe;max-width:80%;margin:7px 0}.message.me{margin-left:auto;background:var(--brand);color:#fff}.chatbar{display:flex;gap:8px;margin-top:10px}.mobile{display:none}.safe{background:#ecfbf4;border:1px solid #ccefe0}.empty{text-align:center;padding:35px;color:var(--muted)}
@media(max-width:760px){.nav{display:none}.mobile{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:5px}.mobile button{font-size:11px}.mobile span{display:block;font-size:18px}.hero,.two,.three{grid-template-columns:1fr}main{padding-bottom:100px}}
</style>
</head>
<body>
<header class="top"><div class="logo"><div class="mark">A</div>Aqra Ace</div><nav class="nav" id="nav"></nav><button class="secondary" id="accountBtn" onclick="authModal()">Join</button></header>
<main id="view"></main><nav class="mobile" id="mobile"></nav>
<div id="modal" class="modal hidden"><div class="card" id="modalBody"></div></div>
<script>
let token=localStorage.getItem("aqra_token")||"", me=JSON.parse(localStorage.getItem("aqra_me")||"null"), page="home", ws=null, activeChat=null;
const navs=[["home","Home","⌂"],["discover","Discover","✦"],["friends","Friends","♡"],["messages","Messages","▣"],["profile","Profile","●"]];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};if(opt.body)opt.headers["Content-Type"]="application/json";let r=await fetch("/api"+path,opt);let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
function nav(){let x=navs.map(n=>`<button class="${page==n[0]?"active":""}" onclick="go('${n[0]}')">${n[1]}</button>`).join("");document.querySelector("#nav").innerHTML=x;document.querySelector("#mobile").innerHTML=navs.map(n=>`<button class="${page==n[0]?"active":""}" onclick="go('${n[0]}')"><span>${n[2]}</span>${n[1]}</button>`).join("")}
function go(p){if(!me&&p!="home"){authModal();return}page=p;render()}
async function render(){nav();if(page=="home")view.innerHTML=home();if(page=="discover")await discover();if(page=="friends")await friends();if(page=="messages")await messages();if(page=="profile")profile();document.querySelector("#accountBtn").textContent=me?"Logout":"Join"}
function home(){return `<section class="hero"><div><div class="muted">A safer way to meet peers</div><h1>Aqra <span>Ace</span><br><small>Meet. Connect. Belong.</small></h1><p>Real accounts. Real friendships. Real-time messaging after mutual acceptance.</p><button class="primary" onclick="${me?"go('discover')":"authModal()"}">${me?"Discover peers":"Join Aqra Ace"}</button></div><div class="card safe"><h2>Friendship first.</h2><p>Use a codename. Keep exact location and private contact details out of profiles. Messaging unlocks only after both users accept the friendship.</p></div></section><div class="grid three"><div class="card"><b>1</b><h3>Create</h3><p class="muted">Make a codename-based profile.</p></div><div class="card"><b>2</b><h3>Discover</h3><p class="muted">Find age-compatible peers by shared interests.</p></div><div class="card"><b>3</b><h3>Connect</h3><p class="muted">Mutual friendships unlock live chat.</p></div></div>`}
async function discover(){view.innerHTML=`<h2>Discover</h2><p class="muted">Showing peers within a broad ±2-year age range. Exact location is never displayed.</p><input id="q" class="search" placeholder="Search codenames"><div id="people" class="grid two" style="margin-top:15px"></div>`;let people=await api("/discover");const draw=()=>people.filter(p=>p.codename.toLowerCase().includes((q.value||"").toLowerCase())).map(p=>`<div class="card"><div class="profile"><div class="avatar">${esc(p.codename[0])}</div><div><h3>${esc(p.codename)}</h3><div class="muted">${p.age} · ${esc(p.className)}</div></div></div><p>${esc(p.bio)}</p><div>${p.interests.map(x=>`<span class="pill">${esc(x)}</span>`).join("")}</div><p class="muted">${p.common?`${p.common} shared interest${p.common>1?"s":""}`:"Similar age"}</p><button class="primary" onclick="request('${p.id}')">Add friend</button> <button class="secondary" onclick="report('${p.id}')">Report</button></div>`).join("")||`<div class="card empty">No compatible profiles found.</div>`;q.oninput=draw;draw()}
async function request(id){try{await api("/friends/request/"+id,{method:"POST"});alert("Friend request sent.");render()}catch(e){alert(e.message)}}
async function friends(){view.innerHTML=`<h2>Friends</h2><div id="friendList"></div>`;let fs=await api("/friends");friendList.innerHTML=fs.length?fs.map(f=>`<div class="card" style="margin:12px 0"><div class="row"><div class="profile"><div class="avatar">${esc(f.codename[0])}</div><div><b>${esc(f.codename)}</b><div class="muted">${f.age} · ${esc(f.className)}</div></div></div><div>${f.status=="pending"&&f.direction=="incoming"?`<button class="primary" onclick="accept('${f.id}')">Accept</button>`:f.status=="accepted"?`<button class="primary" onclick="openChat('${f.id}','${esc(f.codename)}')">Chat</button>`:"Request sent"} ${f.status!="accepted"?`<button class="danger" onclick="block('${f.id}')">Block</button>`:""}</div></div></div>`).join(""):`<div class="card empty">No friendships yet.</div>`}
async function accept(id){await api("/friends/accept/"+id,{method:"POST"});render()}
async function block(id){await api("/block/"+id,{method:"POST"});render()}
async function report(id){let reason=prompt("Briefly describe the concern:");if(reason===null)return;await api("/report/"+id,{method:"POST",body:JSON.stringify({reason})});alert("Report received.");}
async function messages(){let fs=await api("/friends");let accepted=fs.filter(x=>x.status=="accepted");view.innerHTML=`<h2>Messages</h2><p class="muted">Live messaging is available only between mutual friends.</p><div class="grid two">${accepted.length?accepted.map(f=>`<div class="card"><div class="profile"><div class="avatar">${esc(f.codename[0])}</div><div><h3>${esc(f.codename)}</h3><div class="muted">Mutual friend</div></div></div><button class="primary" style="margin-top:12px" onclick="openChat('${f.id}','${esc(f.codename)}')">Open chat</button></div>`).join(""):`<div class="card empty">Mutual friendship unlocks messaging.</div>`}</div>`}
async function openChat(id,name){activeChat=id;let msgs=await api("/messages/"+id);modalBody.innerHTML=`<div class="row"><h2>Chat with ${esc(name)}</h2><button class="secondary" onclick="closeModal()">Close</button></div><div class="chat" id="chat">${msgs.map(m=>`<div class="message ${m.sender===me.id?"me":""}">${esc(m.body)}</div>`).join("")}</div><div class="chatbar"><input id="msg" class="search" maxlength="1000" placeholder="Write a message"><button class="primary" onclick="sendMsg()">Send</button></div><p class="muted" style="font-size:12px">Never share passwords, exact location, financial information or private contact details.</p>`;modal.classList.remove("hidden");connectWS()}
function connectWS(){if(ws&&ws.readyState<2)return;ws=new WebSocket(`${location.protocol==="https:"?"wss":"ws"}://${location.host}/?token=${encodeURIComponent(token)}`);ws.onmessage=e=>{let x=JSON.parse(e.data);if(x.type==="message"&&activeChat&&(x.message.sender===activeChat||x.message.receiver===activeChat)){let d=document.createElement("div");d.className="message "+(x.message.sender===me.id?"me":"");d.textContent=x.message.body;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}}}
function sendMsg(){let x=msg.value.trim();if(!x||!ws||ws.readyState!==1)return;ws.send(JSON.stringify({to:activeChat,body:x}));msg.value=""}
function profile(){view.innerHTML=`<h2>Your profile</h2><div class="grid two"><div class="card"><div class="profile"><div class="avatar">${esc(me.codename[0])}</div><div><h2>${esc(me.codename)}</h2><div class="muted">${me.age} · ${esc(me.className)}</div></div></div><p>${esc(me.bio||"No bio yet.")}</p><div>${me.interests.map(x=>`<span class="pill">${esc(x)}</span>`).join("")}</div></div><div class="card safe"><h3>Safety Center</h3><p>Keep identity details private. Report or block anything uncomfortable.</p></div></div>`}
function authModal(){modalBody.innerHTML=`<div class="row"><h2>${me?"Account":"Join Aqra Ace"}</h2><button class="secondary" onclick="closeModal()">×</button></div>${me?`<p>You are signed in as <b>${esc(me.codename)}</b>.</p><button class="danger" onclick="logout()">Log out</button>`:`<div class="form"><label>Codename<input id="code" maxlength="24" placeholder="NovaFox"></label><label>Password<input id="pass" type="password" minlength="8" placeholder="8+ characters"></label><div id="extra"><label>Age<select id="age">${Array.from({length:8},(_,i)=>`<option>${13+i}</option>`).join("")}</select></label><label>Class / level<input id="cls" value="S.5"></label><label>Interests<input id="ints" placeholder="Music, Coding, Football"></label><label>Languages<input id="langs" placeholder="English, Luganda"></label><label>Safe bio<input id="bio" maxlength="160"></label></div><button class="primary" onclick="register()">Create account</button><button class="secondary" onclick="login()">I already have an account</button><p class="muted" style="font-size:12px">Use a codename and do not put your real name, phone number or exact location in the profile.</p></div>`}`;modal.classList.remove("hidden")}
async function register(){try{let d=await api("/register",{method:"POST",body:JSON.stringify({codename:code.value.trim(),password:pass.value,age:+age.value,className:cls.value,interests:ints.value,languages:langs.value,bio:bio.value})});signed(d)}catch(e){alert(e.message)}}
async function login(){try{let d=await api("/login",{method:"POST",body:JSON.stringify({codename:code.value.trim(),password:pass.value})});signed(d)}catch(e){alert(e.message)}}
function signed(d){token=d.token;me=d.user;localStorage.setItem("aqra_token",token);localStorage.setItem("aqra_me",JSON.stringify(me));closeModal();page="discover";render()}
function logout(){token="";me=null;localStorage.clear();closeModal();page="home";render()}
function closeModal(){modal.classList.add("hidden")}modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});
render();
</script>
</body>
</html>
